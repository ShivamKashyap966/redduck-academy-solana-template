[package]
edition = "2021"
rust-version = "1.81.0"
name = "solana-system-interface"
version = "3.2.0"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Instructions and constructors for the System program"
homepage = "https://anza.xyz/"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/anza-xyz/solana-sdk"

[features]
alloc = []
bincode = [
    "dep:solana-instruction",
    "alloc",
    "serde",
]
frozen-abi = [
    "dep:solana-frozen-abi",
    "dep:solana-frozen-abi-macro",
    "serde",
    "std",
    "solana-address/frozen-abi",
    "solana-address/std",
]
serde = [
    "dep:serde",
    "dep:serde_derive",
    "serde/alloc",
    "solana-address/serde",
]
std = []

[lib]
name = "solana_system_interface"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies.num-traits]
version = "0.2.18"
default-features = false

[dependencies.serde]
version = "1.0.226"
optional = true
default-features = false

[dependencies.serde_derive]
version = "1.0.226"
optional = true

[dependencies.solana-address]
version = "2.0.0"
features = ["decode"]

[dependencies.solana-frozen-abi]
version = "3.0.0"
features = ["frozen-abi"]
optional = true

[dependencies.solana-frozen-abi-macro]
version = "3.0.1"
features = ["frozen-abi"]
optional = true

[dependencies.solana-instruction]
version = "3.0.0"
features = [
    "bincode",
    "std",
]
optional = true
default-features = false

[dependencies.solana-msg]
version = "3.0.0"
default-features = false

[dependencies.solana-program-error]
version = "3.0.0"
